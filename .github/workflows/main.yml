name: Build Xiaomi Vayu Kernel with KernelSU Next

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      KBUILD_BUILD_USER: GitHub
      KBUILD_BUILD_HOST: Actions
      DEFCONFIG: vendor/xiaomi/vayu_defconfig

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup Prelude Clang toolchain
        run: |
          CLANG_VERSION="clang-r450784e"
          CLANG_TAR="${CLANG_VERSION}-linux-x64.tar.xz"
          CLANG_URL="https://github.com/jjpprrrr/prelude-clang/releases/download/v16/${CLANG_TAR}"
          mkdir -p toolchain
          wget -qO toolchain/${CLANG_TAR} $CLANG_URL
          tar -xf toolchain/${CLANG_TAR} -C toolchain
          echo "Toolchain extracted."

      - name: Apply KernelSU Next Patch
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next-susfs/kernel/setup.sh" | bash -s next-susfs

      - name: Prepare kernel config
        run: |
          make O=out ${{ env.DEFCONFIG }}

      - name: Build kernel
        run: |
          export PATH=$(pwd)/toolchain/${CLANG_VERSION}-linux-x64/bin:$PATH
          make -j$(nproc) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Archive kernel image
        uses: actions/upload-artifact@v3
        with:
          name: kernel-image
          path: out/arch/arm64/boot/Image.gz-dtb
